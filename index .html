<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spice Garden - Restaurant</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#fff8f0;color:#333}
header{background:#8b0000;color:white;padding:15px 30px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}
header h1{font-size:24px}
nav a{color:white;text-decoration:none;margin-left:20px;font-weight:bold}
nav a:hover{color:#ffd700}
.hero{background:url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=1200') center/cover;height:400px;display:flex;flex-direction:column;justify-content:center;align-items:center;color:white;text-align:center}
.hero h2{font-size:48px;background:rgba(0,0,0,0.5);padding:10px 20px;border-radius:10px}
.hero p{font-size:20px;margin-top:10px;background:rgba(0,0,0,0.5);padding:8px 15px;border-radius:8px}
.hero button{margin-top:20px;padding:12px 25px;background:#ff9900;border:none;color:white;font-size:18px;border-radius:8px;cursor:pointer}
.hero button:hover{background:#e68a00}
.section{padding:40px 30px;text-align:center}
.section h2{font-size:32px;margin-bottom:20px;color:#8b0000}
.menu{display:flex;flex-wrap:wrap;justify-content:center;gap:20px}
.card{background:white;width:260px;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1);overflow:hidden;padding-bottom:15px}
.card img{width:100%;height:170px;object-fit:cover}
.card h3{margin:12px 0 5px}
.card p{color:#666;font-size:14px;padding:0 10px}
.price{color:#8b0000;font-weight:bold;font-size:18px;margin:8px 0}
.card button{background:#8b0000;color:white;border:none;padding:10px 20px;border-radius:6px;cursor:pointer}
.card button:hover{background:#a30000}
#cart{background:#fff3e0;padding:25px;border-radius:12px;max-width:500px;margin:20px auto;text-align:left}
#cart ul{list-style:none}
#cart li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #ddd}
#total{font-weight:bold;font-size:20px;text-align:right;margin-top:10px}
#orderBtn{width:100%;padding:12px;background:green;color:white;border:none;font-size:18px;border-radius:8px;cursor:pointer;margin-top:10px}
form{max-width:500px;margin:0 auto;text-align:left}
input,select{width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:6px}
form button{width:100%;padding:12px;background:#8b0000;color:white;border:none;font-size:18px;border-radius:8px;cursor:pointer}
footer{background:#222;color:white;text-align:center;padding:20px;margin-top:20px}
</style>
</head>
<body>
<header>
<h1>🍽️ SPICE GARDEN</h1>
<nav><a href="#home">Home</a><a href="#menu">Menu</a><a href="#cart">Cart</a><a href="#book">Book Table</a></nav>
</header>
<section class="hero" id="home">
<h2>Welcome to Spice Garden</h2>
<p>Delicious Food • Best Taste • Fast Service</p>
<button onclick="document.getElementById('menu').scrollIntoView({behavior:'smooth'})">View Menu</button>
</section>
<section class="section" id="menu">
<h2>Our Menu</h2>
<div class="menu" id="menuList"></div>
</section>
<section class="section" id="cart">
<h2>Your Cart 🛒</h2>
<div id="cart">
<ul id="cartItems"><li>Cart is empty</li></ul>
<p id="total">Total: ₹0</p>
<button id="orderBtn" onclick="placeOrder()">Place Order</button>
<p id="orderMsg" style="color:green;font-weight:bold;text-align:center;margin-top:10px"></p>
</div>
</section>
<section class="section" id="book">
<h2>Book a Table</h2>
<form onsubmit="bookTable(event)">
<label>Your Name</label>
<input type="text" id="cname" placeholder="Enter your name" required>
<label>Phone</label>
<input type="tel" id="cphone" placeholder="Enter phone number" required>
<label>Date</label>
<input type="date" required>
<label>Guests</label>
<select><option>1 Person</option><option>2 People</option><option>4 People</option><option>6+ People</option></select>
<button type="submit">Book Now</button>
<p id="bookMsg" style="color:green;font-weight:bold;text-align:center;margin-top:10px"></p>
</form>
</section>
<footer>
<p>📍 Chennai, Tamil Nadu | 📞 98765 43210 | ⏰ 11 AM - 11 PM</p>
<p>© 2026 Spice Garden - Made by Rakshana J</p>
</footer>
<script>
const foods=[
{name:"Chicken Biryani",price:220,desc:"Fragrant basmati rice with spicy chicken",img:"https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?w=400"},
{name:"Paneer Butter Masala",price:180,desc:"Creamy paneer in rich tomato gravy",img:"https://images.unsplash.com/photo-1631452180519-c014fe946bc7?w=400"},
{name:"Pizza",price:299,desc:"Cheesy pizza with fresh toppings",img:"https://images.unsplash.com/photo-1513104890138-7c749659a591?w=400"},
{name:"Burger",price:149,desc:"Crispy burger with fries",img:"https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=400"},
{name:"Fried Rice",price:160,desc:"Veg fried rice with manchurian",img:"https://images.unsplash.com/photo-1512058564366-18510be2db19?w=400"},
{name:"Ice Cream",price:99,desc:"Vanilla, Chocolate & Butterscotch",img:"https://images.unsplash.com/photo-1563805042-7684c019e1cb?w=400"}
];
let cart=[];
let total=0;
const menuList=document.getElementById('menuList');
foods.forEach((f,i)=>{
menuList.innerHTML+=`<div class="card"><img src="${f.img}"><h3>${f.name}</h3><p>${f.desc}</p><p class="price">₹${f.price}</p><button onclick="addToCart(${i})">Add to Cart</button></div>`;
});
function addToCart(i){cart.push(foods[i]);total+=foods[i].price;updateCart();alert(foods[i].name+" added to cart!");}
function updateCart(){
const list=document.getElementById('cartItems');
if(cart.length===0){list.innerHTML="<li>Cart is empty</li>";}
else{list.innerHTML=cart.map((c,idx)=>`<li>${c.name} - ₹${c.price} <button onclick="removeItem(${idx})" style="background:red;color:white;border:none;padding:3px 8px;border-radius:4px;cursor:pointer">X</button></li>`).join('');}
document.getElementById('total').innerText="Total: ₹"+total;
}
function removeItem(idx){total-=cart[idx].price;cart.splice(idx,1);updateCart();}
function placeOrder(){
if(cart.length===0){alert("Cart is empty! Add some food.");return;}
document.getElementById('orderMsg').innerText="✅ Order Placed! Total ₹"+total+". Thank you!";
cart=[];total=0;updateCart();
}
function bookTable(e){
e.preventDefault();
const name=document.getElementById('cname').value;
document.getElementById('bookMsg').innerText="✅ Thank you "+name+"! Your table is booked.";
}
</script>
</body>
</html>
